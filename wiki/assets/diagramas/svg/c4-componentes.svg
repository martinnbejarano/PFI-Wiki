  <text x="634" y="116" class="l" text-anchor="start">HTTPS</text>
  <text x="1206" y="506" class="l" text-anchor="start">índice</text>
  <text x="312" y="604" class="l" text-anchor="start">clasificador</text>
  <text x="634" y="604" class="l" text-anchor="start">señales</text>
  <text x="882" y="604" class="l" text-anchor="start">contraste</text>
  <text x="1372" y="560" class="l" text-anchor="start">sqlite-vec</text>
  <text x="122" y="800" class="l" text-anchor="start">/clasificar</text>
