<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="'Avenir Next','Segoe UI',system-ui,Helvetica,Arial,sans-serif">
  <!-- Plantilla: copiar, renombrar sin "_" y borrar lo que sobre. Ver README.md. -->
  <style>
    .t{font-size:24px;font-weight:700;fill:#16181D;text-anchor:middle}
    .d{font-size:20px;fill:#464F5C;text-anchor:middle}
    .l{font-size:18px;fill:#464F5C}
    .cl{font-size:20px;font-style:italic;fill:#464F5C;text-anchor:end}
    .c{fill:none;stroke:#2F63D8;stroke-width:2;stroke-dasharray:10 8;opacity:.5}
    .a{fill:none;stroke:#5A6472;stroke-width:2.2;marker-end:url(#punta)}
    .ad{fill:none;stroke:#5A6472;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#punta)}
  </style>
  <defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker></defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Actor / cliente (violeta) -->
  <rect x="40" y="0" width="340" height="88" rx="11" fill="#EFEAFB" stroke="#7B5BC4" stroke-width="2"/>
  <text x="210" y="37" class="t">Actor o cliente</text>
  <text x="210" y="68" class="d">Una línea, ≤ 32 caracteres</text>

  <!-- Contenedor del sistema (punteado azul, nombre en itálica arriba a la derecha) -->
  <rect x="20" y="128" width="1120" height="260" rx="16" class="c"/>
  <text x="1120" y="160" class="cl">Sistema · Tecnología</text>

  <!-- Componente propio (azul) -->
  <rect x="40" y="176" width="340" height="88" rx="11" fill="#EAF0FE" stroke="#2F63D8" stroke-width="2"/>
  <text x="210" y="213" class="t">Componente propio</text>
  <text x="210" y="244" class="d">Qué hace, en pocas palabras</text>

  <!-- Módulo de análisis (ámbar) -->
  <rect x="410" y="176" width="340" height="88" rx="11" fill="#FDF3E3" stroke="#C08A2E" stroke-width="2"/>
  <text x="580" y="213" class="t">Módulo de análisis</text>
  <text x="580" y="244" class="d">Devuelve un puntaje</text>

  <!-- Servicio externo (gris) -->
  <rect x="40" y="448" width="340" height="88" rx="11" fill="#F1F3F5" stroke="#98A2AE" stroke-width="2"/>
  <text x="210" y="485" class="t">Servicio externo</text>
  <text x="210" y="516" class="d">Fuera de nuestro control</text>

  <!-- Fuente externa confiable (verde) -->
  <rect x="780" y="448" width="340" height="88" rx="11" fill="#E9F5EE" stroke="#4E9B72" stroke-width="2"/>
  <text x="950" y="485" class="t">Fuente confiable</text>
  <text x="950" y="516" class="d">Oficial, medio o verificador</text>

  <!-- Flechas: solo ortogonales, de borde a borde -->
  <polyline points="210,88 210,176" class="a"/>
  <text x="222" y="116" class="l">HTTPS</text>
  <polyline points="380,220 410,220" class="a"/>
  <polyline points="210,264 210,448" class="a"/>
  <text x="222" y="420" class="l">SQL</text>
  <polyline points="750,220 950,220 950,448" class="ad"/>
  <text x="962" y="420" class="l">asíncrono</text>
</svg>
