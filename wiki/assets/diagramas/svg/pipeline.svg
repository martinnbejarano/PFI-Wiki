<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 424" width="1160" height="424" font-family="'Avenir Next','Segoe UI',system-ui,Helvetica,Arial,sans-serif">
  <style>
    .t{font-size:24px;font-weight:700;fill:#16181D;text-anchor:middle}
