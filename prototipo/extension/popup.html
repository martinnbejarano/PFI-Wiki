<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Detector de desinformación</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #15202b;
        background: #fff;
        font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 15px; }
      p { margin: 0 0 10px; color: #5b6570; font-size: 12.5px; }
      .estado {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border: 1px solid #d3d9df;
        border-radius: 8px;
        background: #f1f3f5;
        color: #5b6570;
        font-size: 12.5px;
      }
      .estado.vivo { background: #e9f6ef; border-color: #a8d7bf; color: #1a7a4c; }
      .estado.caido { background: #fdecea; border-color: #f0b4ad; color: #c0392b; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>Detector de desinformación</h1>
    <p>Prototipo. Abrí x.com y tocá el indicador de un tuit para analizarlo.</p>
    <div class="estado" id="estado">Consultando el servicio local…</div>
    <p style="margin-top: 10px">
      Servicio esperado en <code>http://localhost:8000</code>
    </p>
    <script type="module" src="./src/popup/main.ts"></script>
