# Las dos baterías del prototipo, en cada push y en cada pull request.
# Sin secretos: la batería del servicio no depende de red ni de la credencial.
name: CI

on:
  push:
  pull_request:

jobs:
  servicio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo/servicio
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pfi
          POSTGRES_PASSWORD: pfi
          POSTGRES_DB: pfi
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pfi" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      ADAPTADOR: llm
      INTERVALO_DESPERTAR_CLASIFICADOR_S: "3600"
      TOPE_GRATUITO_MENSUAL: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prototipo/servicio/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototipo/extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
