# Las dos baterías del prototipo, en cada push y en cada pull request.
# Sin secretos: la batería del servicio no depende de red ni de la credencial.
name: CI

on:
  push:
  pull_request:

jobs:
  servicio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo/servicio
    env:
      ADAPTADOR: llm
      INTERVALO_DESPERTAR_CLASIFICADOR_S: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prototipo/servicio/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototipo/extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
